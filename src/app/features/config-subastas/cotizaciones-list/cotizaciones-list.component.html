<div class="page-container max-w-[1400px]">
  <div class="mb-8 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <div><h1 class="text-[24px] font-[590] text-[var(--color-porcelain)]">Cotizaciones</h1><p class="text-[14px] text-[var(--color-storm-cloud)]">Administrá las subastas y procesos de compra.</p></div>
    <div class="flex w-full flex-col gap-2 sm:w-auto sm:flex-row sm:items-center sm:gap-3">
      <div class="w-full sm:w-56"><app-custom-select placeholder="Ejercicio" [options]="vigenciaOptions()" [value]="selectedVigenciaId()" (valueChange)="onVigenciaChange($event)"></app-custom-select></div>
      <a routerLink="/config-subastas/nueva" class="flex items-center justify-center gap-2 rounded-xl bg-[var(--color-neon-lime)] px-4 py-2.5 text-[14px] font-[590] text-black hover:brightness-110"><lucide-icon name="plus" [size]="16"></lucide-icon>Nueva Subasta</a>
    </div>
  </div>

  <ng-template #estadoTpl let-row>
    <span class="px-2.5 py-0.5 rounded-full text-[11px] font-[590]" [class.bg-emerald-500/10]="row.estado==='Publicada'" [class.text-emerald-400]="row.estado==='Publicada'" [class.bg-[var(--color-cyan-spark)]/10]="row.estado==='Programada'" [class.text-[var(--color-cyan-spark)]]="row.estado==='Programada'">{{ row.estado }}</span>
  </ng-template>
  <ng-template #accionesTpl let-row>
    <div class="flex justify-end gap-1">
      <a [routerLink]="['/config-subastas', row.idCotizacion]" class="rounded-lg p-2 text-[var(--color-storm-cloud)] hover:text-[var(--color-cyan-spark)]"><lucide-icon name="pencil" [size]="16"></lucide-icon></a>
    </div>
  </ng-template>

  <app-smart-table
    [columns]="columns"
    [data]="items()"
    [customTemplates]="customTemplates()"
    [loading]="loading()"
    [pageSize]="999"
    emptyMessage="No hay cotizaciones"
    emptySubMessage="Creá la primera subasta.">
  </app-smart-table>
</div>
