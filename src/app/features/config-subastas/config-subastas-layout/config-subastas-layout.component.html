<div class="flex h-dvh min-h-0 overflow-hidden bg-[var(--color-pitch-black)]">
  @if (isSidebarOpen()) {<div (click)="closeSidebar()" class="fixed inset-0 z-40 bg-slate-950/35 lg:hidden transition-opacity"></div>}
  <aside [ngClass]="isSidebarOpen() ? 'w-[min(18rem,calc(100vw-2rem))] translate-x-0 lg:w-72' : '-translate-x-full lg:translate-x-0 lg:w-[68px]'" class="fixed inset-y-0 left-0 z-50 flex flex-col border-r border-[var(--color-charcoal-grey)] bg-[var(--color-graphite)] shadow-2xl lg:shadow-none overflow-hidden transition-[transform,width] duration-300 max-w-[calc(100vw-2rem)] will-change-transform lg:static lg:translate-x-0">
    <div class="flex h-16 shrink-0 items-center px-4 border-b border-[var(--color-charcoal-grey)]" [ngClass]="isSidebarOpen() ? 'justify-between' : 'justify-center'">
      <a routerLink="/config-subastas" class="flex items-center gap-3 min-w-0">
        <div class="flex size-8 shrink-0 items-center justify-center rounded-lg bg-[var(--color-neon-lime)]/10 text-[var(--color-neon-lime)]"><lucide-icon name="settings" [size]="18"></lucide-icon></div>
        <span class="text-[15px] font-[590] text-[var(--color-porcelain)] truncate transition-opacity duration-300" [class.opacity-0]="!isSidebarOpen()">Config. Subastas</span>
      </a>
      <button (click)="closeSidebar()" class="lg:hidden text-[var(--color-storm-cloud)] hover:text-[var(--color-porcelain)]"><lucide-icon name="x" [size]="20"></lucide-icon></button>
    </div>
    <nav class="flex-1 overflow-y-auto py-6 px-3 space-y-1">
      <p class="px-3 mb-2 text-[10px] font-[590] uppercase tracking-widest text-[var(--color-storm-cloud)]" [class.opacity-0]="!isSidebarOpen()" [class.hidden]="!isSidebarOpen()">Subastas</p>
      <a routerLink="/config-subastas" routerLinkActive="nav-item-active" [routerLinkActiveOptions]="{exact:true}" (click)="closeSidebarOnMobile()" class="app-nav-link flex items-center gap-3 rounded-xl border border-transparent px-3 py-3 text-[14px] font-[510] text-[var(--color-light-steel)] hover:bg-[var(--color-deep-slate)]/50 hover:text-[var(--color-porcelain)]"><lucide-icon name="list" [size]="18" class="shrink-0"></lucide-icon><span [class.opacity-0]="!isSidebarOpen()" [class.hidden]="!isSidebarOpen()">Cotizaciones</span></a>
      <a routerLink="/config-subastas/nueva" routerLinkActive="nav-item-active" (click)="closeSidebarOnMobile()" class="app-nav-link flex items-center gap-3 rounded-xl border border-transparent px-3 py-3 text-[14px] font-[510] text-[var(--color-light-steel)] hover:bg-[var(--color-deep-slate)]/50 hover:text-[var(--color-porcelain)]"><lucide-icon name="plus" [size]="18" class="shrink-0"></lucide-icon><span [class.opacity-0]="!isSidebarOpen()" [class.hidden]="!isSidebarOpen()">Nueva Subasta</span></a>
      <div class="my-6 border-t border-[var(--color-charcoal-grey)] mx-3"></div>
      <a routerLink="/modulos" class="flex items-center gap-3 rounded-xl px-3 py-3 text-[14px] font-[510] text-[var(--color-storm-cloud)] hover:text-[var(--color-porcelain)]"><lucide-icon name="arrow-left" [size]="18" class="shrink-0"></lucide-icon><span [class.opacity-0]="!isSidebarOpen()" [class.hidden]="!isSidebarOpen()">Volver al Panel</span></a>
    </nav>
  </aside>
  <div class="relative flex min-w-0 flex-1 flex-col overflow-hidden">
    <app-header variant="module" title="Configuración de Subastas">
      <ng-container header-left>
        <button (click)="toggleSidebar()" class="lg:hidden flex items-center justify-center rounded-lg p-2 text-[var(--color-storm-cloud)] transition-colors hover:bg-[var(--color-deep-slate)] hover:text-[var(--color-porcelain)]">
          <lucide-icon name="menu" [size]="24"></lucide-icon>
        </button>
        <button (click)="toggleSidebar()" class="hidden items-center justify-center rounded-lg p-2 text-[var(--color-storm-cloud)] transition-colors hover:bg-[var(--color-deep-slate)] hover:text-[var(--color-porcelain)] lg:flex">
          <lucide-icon [name]="isSidebarOpen() ? 'panel-left-close' : 'panel-left'" [size]="20"></lucide-icon>
        </button>
      </ng-container>
    </app-header>
    <main id="main-content" tabindex="-1" class="min-w-0 flex-1 overflow-y-auto overflow-x-hidden px-3 py-4 sm:p-6 lg:p-8"><router-outlet></router-outlet></main>
    <app-footer></app-footer>
  </div>
</div>
