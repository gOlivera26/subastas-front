@if (isOpen) {
  <div class="fixed inset-0 z-[160] flex items-end justify-center p-2 sm:items-center sm:p-6" role="dialog" aria-modal="true">
    <div class="fixed inset-0 bg-slate-950/55 backdrop-blur-sm transition-opacity animate-fade-in" (click)="onCancel()"></div>

    <div class="relative flex w-full max-w-md flex-col overflow-hidden rounded-2xl border border-[var(--color-charcoal-grey)] bg-[var(--color-graphite)] p-5 shadow-2xl animate-scale-in sm:p-6">
      <div class="flex items-start gap-4">
        <div class="flex h-12 w-12 flex-shrink-0 items-center justify-center rounded-full"
             [ngClass]="{
               'bg-red-500/10 text-red-400 ring-1 ring-red-500/20': type === 'danger',
               'bg-amber-500/10 text-amber-400 ring-1 ring-amber-500/20': type === 'warning',
               'bg-[var(--color-cyan-spark)]/10 text-[var(--color-cyan-spark)] ring-1 ring-[var(--color-cyan-spark)]/20': type === 'info'
             }">
          @if (type === 'danger') { <lucide-icon name="alert-circle" class="h-6 w-6"></lucide-icon> }
          @if (type === 'warning') { <lucide-icon name="alert-triangle" class="h-6 w-6"></lucide-icon> }
          @if (type === 'info') { <lucide-icon name="info" class="h-6 w-6"></lucide-icon> }
        </div>

        <div class="min-w-0 flex-1">
          <h3 class="text-[17px] font-[650] leading-6 text-[var(--color-porcelain)]">{{ title }}</h3>
          <p class="mt-2 text-[14px] leading-6 text-[var(--color-storm-cloud)]">{{ message }}</p>
        </div>
      </div>

      <div class="mt-6 flex flex-col-reverse gap-2 sm:flex-row sm:justify-end sm:gap-3">
        <button type="button" (click)="onCancel()" class="inline-flex w-full items-center justify-center rounded-xl border border-[var(--color-charcoal-grey)] bg-[var(--color-graphite)] px-4 py-2.5 text-[13px] font-[590] text-[var(--color-porcelain)] transition-all sm:w-auto">{{ cancelText }}</button>
        <button type="button" (click)="onConfirm()" class="inline-flex w-full items-center justify-center rounded-xl px-4 py-2.5 text-[13px] font-[650] text-white shadow-sm transition-all sm:w-auto"
                [ngClass]="{
                  'bg-red-600': type === 'danger',
                  'bg-amber-600': type === 'warning',
                  'bg-[var(--color-cyan-spark)] text-black': type === 'info'
                }">{{ confirmText }}</button>
      </div>
    </div>
  </div>
}
