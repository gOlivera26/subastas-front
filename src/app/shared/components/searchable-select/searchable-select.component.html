<div class="relative">
  <label *ngIf="label()" [id]="selectId + '-label'" class="mb-1 block text-sm font-medium text-[var(--color-light-steel)]">{{ label() }}</label>

  <button
    type="button"
    (click)="toggleDropdown()"
    (keydown)="onTriggerKeydown($event)"
    [attr.aria-haspopup]="'listbox'"
    [attr.aria-expanded]="isOpen()"
    [attr.aria-controls]="listboxId"
    [attr.aria-labelledby]="label() ? selectId + '-label' : null"
    [attr.aria-label]="!label() ? 'Seleccionar opción' : null"
    class="flex w-full items-center justify-between rounded-lg border border-[var(--color-charcoal-grey)] bg-[var(--color-pitch-black)] px-3 py-2 text-[var(--color-porcelain)] transition-colors hover:border-[var(--color-cyan-spark)]/45 focus:outline-none focus:ring-2 focus:ring-[var(--color-cyan-spark)]/20">
    <span class="truncate">{{ selectedLabel() }}</span>
    <lucide-icon [name]="isOpen() ? 'chevron-up' : 'chevron-down'" class="h-4 w-4 text-[var(--color-storm-cloud)]" aria-hidden="true"></lucide-icon>
  </button>

  <div *ngIf="isOpen()" role="presentation" class="absolute z-50 mt-1 w-full rounded-lg border border-[var(--color-charcoal-grey)] bg-[var(--color-graphite)] shadow-xl" (click)="stopPropagation($event)">
    <div class="border-b border-[var(--color-charcoal-grey)] p-2">
      <input
        type="text"
        [placeholder]="placeholder()"
        [ngModel]="searchQuery()"
        (ngModelChange)="searchQuery.set($event)"
        (keydown.enter)="$event.stopPropagation()"
        [attr.aria-label]="'Buscar opciones de ' + (label() || 'selector')"
        class="w-full rounded-md border border-[var(--color-charcoal-grey)] bg-[var(--color-pitch-black)] px-3 py-1.5 text-sm text-[var(--color-porcelain)] placeholder:text-[var(--color-fog-grey)] focus:border-transparent focus:outline-none focus:ring-2 focus:ring-[var(--color-cyan-spark)]/30"
        #searchInput
      />
    </div>

    <ul [id]="listboxId" role="listbox" class="max-h-60 overflow-y-auto py-1">
      <li *ngIf="showNullOption() && filteredOptions().length > 0" role="option" [attr.aria-selected]="value() === null || value() === undefined">
        <button type="button" class="w-full px-3 py-2 text-left text-sm text-[var(--color-storm-cloud)] transition-colors hover:bg-[var(--color-deep-slate)] focus:bg-[var(--color-deep-slate)] focus:outline-none" (click)="selectNull()">
          {{ nullLabel() }}
        </button>
      </li>

      <li *ngFor="let option of filteredOptions(); let i = index" role="option" [id]="optionId(i)" [attr.aria-selected]="value() === option.value">
        <button type="button" class="w-full px-3 py-2 text-left text-sm text-[var(--color-porcelain)] transition-colors hover:bg-[var(--color-deep-slate)] focus:bg-[var(--color-deep-slate)] focus:outline-none" (click)="selectOption(option)">
          {{ option.label }}
        </button>
      </li>

      <li *ngIf="filteredOptions().length === 0" role="status" class="px-3 py-2 text-sm text-[var(--color-storm-cloud)]">
        No se encontraron resultados
      </li>
    </ul>
  </div>
</div>

<div *ngIf="isOpen()" class="fixed inset-0 z-40" (click)="closeDropdown()" aria-hidden="true"></div>
